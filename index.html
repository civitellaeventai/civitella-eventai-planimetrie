<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Civitella EventAI - Editor Planimetrie</title>
<script src="https://unpkg.com/konva@9/konva.min.js"></script>
<style>
body { margin:0; font-family: Arial, sans-serif; background:#f5f5f5; }
#toolbar {
  width:260px; height:100vh; background:#ffffff; border-right:1px solid #ccc;
  float:left; padding:15px; box-sizing:border-box; overflow:auto;
}
#container { margin-left:260px; background:#ddd; height:100vh; }
button, select {
  width:100%; padding:9px; margin-bottom:8px; cursor:pointer;
}
h3 { margin-top:0; }
.small { font-size:12px; color:#555; }
</style>
</head>

<body>

<div id="toolbar">
  <h3>Editor Planimetrie</h3>

  <label>Luogo</label>
  <select id="luogo" onchange="changeBase()">
    <option value="LUO-001_PIAZZA_GRAN_SASSO_BASE.png">Piazza Gran Sasso</option>
    <option value="LUO-002_PIAZZA_SAN_GIOVANNI_BASE.png">Piazza San Giovanni</option>
    <option value="LUO-002_PIAZZA_07_GIUGNO_BASE.png">Piazza 07 Giugno</option>
    <option value="LUO-004_CAMPO_SPORTIVO_BASE.png">Campo Sportivo</option>
    <option value="LUO-005_PIAZZA_PESCHIERA_BASE.png">Piazza Peschiera</option>
    <option value="LUO-006_PIAZZA_CHIESA_SCUOLA_BASE.png">Piazza Chiesa/Scuola</option>
  </select>

  <hr>

  <button onclick="addSymbol('GAZEBO','□','#f4a261')">+ Gazebo</button>
  <button onclick="addSymbol('PALCO','▭','#457b9d')">+ Palco</button>
  <button onclick="addSymbol('TAVOLI','⊞','#8d99ae')">+ Tavoli</button>
  <button onclick="addSymbol('ESTINTORE','E','#e63946')">+ Estintore</button>
  <button onclick="addSymbol('PRIMO SOCCORSO','+','#2a9d8f')">+ Primo Soccorso</button>
  <button onclick="addSymbol('ACCESSO','A','#1d3557')">+ Accesso</button>
  <button onclick="addSymbol('ESODO','→','#2b9348')">+ Via di Esodo</button>
  <button onclick="addSymbol('PUBBLICO','P','#6a4c93')">+ Area Pubblico</button>
  <button onclick="addSymbol('SOMMINISTRAZIONE','S','#bc6c25')">+ Somministrazione</button>
  <button onclick="addSymbol('WC','WC','#3a86ff')">+ WC</button>

  <hr>

  <button onclick="deleteSelected()">Elimina selezionato</button>
  <button onclick="clearObjects()">Pulisci oggetti</button>
  <button onclick="exportPNG()">Esporta PNG</button>

  <p class="small">
    Clicca un simbolo per selezionarlo. Trascinalo sulla planimetria.
    Usa i quadratini blu per ridimensionare/ruotare.
  </p>
</div>

<div id="container"></div>

<script>
const width = window.innerWidth - 260;
const height = window.innerHeight;

const stage = new Konva.Stage({
  container: 'container',
  width: width,
  height: height
});

const layer = new Konva.Layer();
stage.add(layer);

let backgroundImage;
let selectedNode = null;

const transformer = new Konva.Transformer({
  rotateEnabled: true,
  enabledAnchors: ['top-left','top-right','bottom-left','bottom-right']
});
layer.add(transformer);

function loadBase(src) {
  const imageObj = new Image();
  imageObj.onload = function() {
    if (backgroundImage) backgroundImage.destroy();

    backgroundImage = new Konva.Image({
      image: imageObj,
      x: 0,
      y: 0,
      width: width,
      height: height,
      listening: false
    });

    layer.add(backgroundImage);
    backgroundImage.moveToBottom();
    layer.draw();
  };
  imageObj.src = src;
}

function changeBase() {
  const src = document.getElementById('luogo').value;
  loadBase(src);
}

function addSymbol(label, symbol, color) {
  const group = new Konva.Group({
    x: width / 2 - 40,
    y: height / 2 - 40,
    draggable: true
  });

  const rect = new Konva.Rect({
    width: 95,
    height: 55,
    fill: 'white',
    stroke: color,
    strokeWidth: 3,
    cornerRadius: 4
  });

  const icon = new Konva.Text({
    text: symbol,
    fontSize: 26,
    fontStyle: 'bold',
    fill: color,
    width: 95,
    align: 'center',
    y: 5
  });

  const text = new Konva.Text({
    text: label,
    fontSize: 11,
    fill: '#111',
    width: 95,
    align: 'center',
    y: 35
  });

  group.add(rect);
  group.add(icon);
  group.add(text);

  group.on('click tap', function() {
    selectedNode = group;
    transformer.nodes([group]);
    layer.draw();
  });

  layer.add(group);
  selectedNode = group;
  transformer.nodes([group]);
  layer.draw();
}

stage.on('click tap', function(e) {
  if (e.target === stage || e.target === backgroundImage) {
    transformer.nodes([]);
    selectedNode = null;
    layer.draw();
  }
});

function deleteSelected() {
  if (selectedNode) {
    selectedNode.destroy();
    transformer.nodes([]);
    selectedNode = null;
    layer.draw();
  }
}

function clearObjects() {
  layer.children.forEach(child => {
    if (child !== backgroundImage && child !== transformer) {
      child.destroy();
    }
  });
  transformer.nodes([]);
  selectedNode = null;
  layer.draw();
}

function exportPNG() {
  transformer.nodes([]);
  layer.draw();

  const dataURL = stage.toDataURL({ pixelRatio: 2 });
  const link = document.createElement('a');
  link.download = 'planimetria_evento.png';
  link.href = dataURL;
  link.click();
}

loadBase('LUO-001_PIAZZA_GRAN_SASSO_BASE.png');
</script>

</body>
</html>
