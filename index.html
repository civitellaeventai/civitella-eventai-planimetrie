<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Civitella EventAI - Editor Planimetrie</title>
  <script src="https://unpkg.com/konva@9/konva.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
  <aside id="toolbar">
    <div class="logo-box">
      <img src="logo_civitellaeventai.png">
      <h2>Civitella EventAI</h2>
      <span>Editor Planimetrie</span>
    </div>

    <label>Luogo</label>
    <select id="luogo">
      <option value="LUO-001_PIAZZA_GRAN_SASSO_BASE.png" data-title="PIAZZA GRAN SASSO">Piazza Gran Sasso</option>
      <option value="LUO-002_PIAZZA_SAN_GIOVANNI_BASE.png" data-title="PIAZZA SAN GIOVANNI">Piazza San Giovanni</option>
      <option value="LUO-003_PIAZZA_07_GIUGNO_BASE.png" data-title="PIAZZA 07 GIUGNO">Piazza 07 Giugno</option>
      <option value="LUO-004_CAMPO_SPORTIVO_BASE.png" data-title="CAMPO SPORTIVO">Campo Sportivo</option>
      <option value="LUO-005_PIAZZA_PESCHIERA_BASE.png" data-title="PIAZZA PESCHIERA">Piazza Peschiera</option>
      <option value="LUO-006_PIAZZA_CHIESA_SCUOLA_BASE.png" data-title="PIAZZA CHIESA / SCUOLA">Piazza Chiesa / Scuola</option>
    </select>

    <label>Ortofoto personalizzata</label>
    <input type="file" id="upload" accept="image/*">

    <h3>Elementi</h3>
    <button data-tool="symbol" data-label="Gazebo" data-icon="⛺" data-color="#f4a261">⛺ Gazebo</button>
    <button data-tool="symbol" data-label="Palco" data-icon="🎤" data-color="#457b9d">🎤 Palco</button>
    <button data-tool="symbol" data-label="Tavoli" data-icon="▦" data-color="#6c757d">▦ Tavoli</button>
    <button data-tool="symbol" data-label="Estintore" data-icon="🧯" data-color="#e63946">🧯 Estintore</button>
    <button data-tool="symbol" data-label="Primo soccorso" data-icon="✚" data-color="#2a9d8f">✚ Primo soccorso</button>
    <button data-tool="symbol" data-label="Accesso" data-icon="🚪" data-color="#1d3557">🚪 Accesso</button>
    <button data-tool="symbol" data-label="Somministrazione" data-icon="🍔" data-color="#bc6c25">🍔 Somministrazione</button>
    <button data-tool="symbol" data-label="WC" data-icon="🚻" data-color="#3a86ff">🚻 WC</button>

    <h3>Disegno</h3>
    <button id="polyBtn">⬠ Perimetro manifestazione</button>
    <button id="closePoly">Chiudi perimetro</button>
    <button id="arrowBtn">➡ Via di fuga</button>

    <h3>Testo</h3>
    <input id="customText" placeholder="Testo personalizzato">
    <button id="textBtn">+ Casella testo</button>

    <h3>Azioni</h3>
    <button id="deleteBtn">Elimina selezionato</button>
    <button id="clearBtn">Pulisci oggetti</button>
    <button id="pdfBtn" class="primary">Esporta PDF A4</button>
  </aside>

  <main id="map-area">
    <div id="map-header">
      <h1>PLANIMETRIA DELL'EVENTO</h1>
      <h2 id="placeTitle">PIAZZA GRAN SASSO</h2>
    </div>
    <div id="stage-wrap">
      <div id="stage-container"></div>
    </div>
  </main>

  <aside id="legend-panel">
    <h2>Legenda</h2>
    <div id="legendList"></div>

    <h2>Note</h2>
    <textarea id="notes" placeholder="Inserisci eventuali note..."></textarea>
  </aside>
</div>

<script src="app.js"></script>
</body>
</html>
