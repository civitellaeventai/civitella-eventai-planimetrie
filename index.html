<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Civitella EventAI Planner</title>

<style>
body{
    margin:0;
    font-family:Arial;
}

#toolbar{
    width:250px;
    height:100vh;
    background:#f3f3f3;
    float:left;
    padding:15px;
    box-sizing:border-box;
}

#canvas-container{
    margin-left:250px;
    padding:10px;
}

button{
    width:100%;
    margin-bottom:10px;
    padding:10px;
}

canvas{
    border:1px solid #ccc;
}
</style>
</head>

<body>

<div id="toolbar">

<h3>Planimetria</h3>

<button onclick="addGazebo()">Gazebo</button>
<button onclick="addPalco()">Palco</button>
<button onclick="addEstintore()">Estintore</button>
<button onclick="addAccesso()">Accesso</button>
<button onclick="downloadImage()">Esporta PNG</button>

</div>

<div id="canvas-container">
<canvas id="canvas" width="1200" height="800"></canvas>
</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const background = new Image();

/*
SOSTITUIRAI QUI L'URL DELLA FOTO DI PIAZZA GRAN SASSO
*/

background.src = "";

background.onload = () => {
    ctx.drawImage(background,0,0,1200,800);
};

let objects=[];

function redraw(){

    ctx.clearRect(0,0,1200,800);

    if(background.complete){
        ctx.drawImage(background,0,0,1200,800);
    }

    objects.forEach(obj=>{

        ctx.fillStyle=obj.color;

        ctx.fillRect(
            obj.x,
            obj.y,
            obj.w,
            obj.h
        );

        ctx.fillStyle="black";

        ctx.fillText(
            obj.label,
            obj.x,
            obj.y-5
        );

    });

}

function addGazebo(){

    objects.push({
        x:100,
        y:100,
        w:40,
        h:40,
        color:"orange",
        label:"Gazebo"
    });

    redraw();

}

function addPalco(){

    objects.push({
        x:150,
        y:150,
        w:60,
        h:40,
        color:"blue",
        label:"Palco"
    });

    redraw();

}

function addEstintore(){

    objects.push({
        x:200,
        y:200,
        w:20,
        h:20,
        color:"red",
        label:"Est."
    });

    redraw();

}

function addAccesso(){

    objects.push({
        x:250,
        y:250,
        w:30,
        h:30,
        color:"green",
        label:"Accesso"
    });

    redraw();

}

function downloadImage(){

    const link=document.createElement("a");

    link.download="planimetria.png";

    link.href=canvas.toDataURL();

    link.click();

}

</script>

</body>
</html>
