<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Civitella EventAI - Editor Planimetrie</title>
<script src="https://unpkg.com/konva@9/konva.min.js"></script>

<style>
body { margin:0; font-family:Arial, sans-serif; background:#f5f5f5; }
#toolbar {
  width:285px; height:100vh; background:#fff; border-right:1px solid #ccc;
  float:left; padding:14px; box-sizing:border-box; overflow:auto;
}
#container { margin-left:285px; background:#d9d9d9; height:100vh; }
button, select, input {
  width:100%; padding:9px; margin-bottom:8px; box-sizing:border-box;
}
button { cursor:pointer; }
.small { font-size:12px; color:#555; line-height:1.35; }
.active { background:#ffe8e8; border:2px solid #d00; }
</style>
</head>

<body>

<div id="toolbar">
  <h3>Editor Planimetrie</h3>

  <label>Luogo</label>
  <select id="luogo" onchange="changeBase()">
    <option value="LUO-001_PIAZZA_GRAN_SASSO_BASE.png">Piazza Gran Sasso</option>
    <option value="LUO-002_PIAZZA_SAN_GIOVANNI_BASE.png">Piazza San Giovanni</option>
    <option value="LUO-003_PIAZZA_07_GIUGNO_BASE.png">Piazza 07 Giugno</option>
    <option value="LUO-004_CAMPO_SPORTIVO_BASE.png">Campo Sportivo</option>
    <option value="LUO-005_PIAZZA_PESCHIERA_BASE.png">Piazza Peschiera</option>
    <option value="LUO-006_PIAZZA_META_BASE.png">Piazza Meta</option>
  </select>

  <hr>

  <button onclick="addSymbol('GAZEBO','▣','#f4a261')">+ Gazebo</button>
  <button onclick="addSymbol('PALCO','▭','#457b9d')">+ Palco</button>
  <button onclick="addSymbol('TAVOLI','⊞','#6c757d')">+ Tavoli</button>
  <button onclick="addSymbol('ESTINTORE','E','#e63946')">+ Estintore</button>
  <button onclick="addSymbol('PRIMO SOCCORSO','✚','#2a9d8f')">+ Primo Soccorso</button>
  <button onclick="addSymbol('ACCESSO','A','#1d3557')">+ Accesso</button>
  <button onclick="addSymbol('SOMMINISTRAZIONE','S','#bc6c25')">+ Somministrazione</button>
  <button onclick="addSymbol('WC','WC','#3a86ff')">+ WC</button>

  <hr>

  <button id="polyBtn" onclick="startPolygon()">+ Perimetro manifestazione</button>
  <button onclick="finishPolygon()">Chiudi perimetro</button>

  <button onclick="addArrow()">+ Via di fuga</button>

  <input id="customText" placeholder="Testo personalizzato">
  <button onclick="addTextBox()">+ Casella testo</button>

  <hr>

  <button onclick="deleteSelected()">Elimina selezionato</button>
  <button onclick="clearObjects()">Pulisci oggetti</button>
  <button onclick="exportPNG()">Esporta PNG</button>

  <p class="small">
    <b>Perimetro:</b> clicca più punti sulla mappa, poi “Chiudi perimetro”.<br>
    Dopo la chiusura puoi spostare i vertici rossi.<br><br>
    <b>Oggetti:</b> clicca, trascina, ruota o ridimensiona.
  </p>
</div>

<div id="container"></div>

<script>
const sidebar = 285;
const width = window.innerWidth - sidebar;
const height = window.innerHeight;

const stage = new Konva.Stage({
  container: 'container',
  width: width,
  height: height
});

const layer = new Konva.Layer();
stage.add(layer);

let backgroundImage = null;
let selectedNode = null;
let polygonMode = false;
let polygonPoints = [];
let tempLine = null;
let tempCircles = [];
let vertexHandles = [];

const transformer = new Konva.Transformer({
  rotateEnabled: true,
  enabledAnchors: ['top-left','top-right','bottom-left','bottom-right']
});
layer.add(transformer);

function loadBase(src) {
  const img = new Image();
  img.onload = function() {
    if (backgroundImage) backgroundImage.destroy();

    const imgRatio = img.width / img.height;
    const canvasRatio = width / height;

    let drawWidth, drawHeight, offsetX, offsetY;

    if (imgRatio > canvasRatio) {
      drawWidth = width;
      drawHeight = width / imgRatio;
      offsetX = 0;
      offsetY = (height - drawHeight) / 2;
    } else {
      drawHeight = height;
      drawWidth = height * imgRatio;
      offsetX = (width - drawWidth) / 2;
      offsetY = 0;
    }

    backgroundImage = new Konva.Image({
      image: img,
      x: offsetX,
      y: offsetY,
      width: drawWidth,
      height: drawHeight,
      listening: true
    });

    layer.add(backgroundImage);
    backgroundImage.moveToBottom();
    layer.draw();
  };
  img.src = src;
}

function changeBase() {
  loadBase(document.getElementById('luogo').value);
}

function selectNode(node) {
  selectedNode = node;
  transformer.nodes([node]);
  hideVertexHandles();
  layer.draw();
}

function addSymbol(label, symbol, color) {
  const group = new Konva.Group({
    x: width / 2 - 45,
    y: height / 2 - 35,
    draggable: true
  });

  const circle = new Konva.Circle({
    x: 45,
    y: 28,
    radius: 26,
    fill: 'white',
    stroke: color,
    strokeWidth: 4
  });

  const icon = new Konva.Text({
    text: symbol,
    fontSize: 24,
    fontStyle: 'bold',
    fill: color,
    width: 90,
    align: 'center',
    y: 15
  });

  const text = new Konva.Text({
    text: label,
    fontSize: 10,
    fill: '#111',
    width: 110,
    align: 'center',
    x: -10,
    y: 58
  });

  group.add(circle, icon, text);
  group.on('click tap', () => selectNode(group));

  layer.add(group);
  selectNode(group);
}

function startPolygon() {
  polygonMode = true;
  polygonPoints = [];
  tempCircles.forEach(c => c.destroy());
  tempCircles = [];
  hideVertexHandles();

  if (tempLine) tempLine.destroy();

  tempLine = new Konva.Line({
    points: [],
    stroke: 'red',
    strokeWidth: 3,
    dash: [10, 6],
    closed: false
  });

  layer.add(tempLine);
  document.getElementById('polyBtn').classList.add('active');
  transformer.nodes([]);
  selectedNode = null;
  layer.draw();
}

stage.on('click tap', function(e) {
  if (polygonMode) {
    const pos = stage.getPointerPosition();
    polygonPoints.push(pos.x, pos.y);

    const circle = new Konva.Circle({
      x: pos.x,
      y: pos.y,
      radius: 5,
      fill: 'red',
      stroke: 'white',
      strokeWidth: 2
    });

    tempCircles.push(circle);
    layer.add(circle);
    tempLine.points(polygonPoints);
    layer.draw();
    return;
  }

  if (e.target === stage || e.target === backgroundImage) {
    transformer.nodes([]);
    selectedNode = null;
    hideVertexHandles();
    layer.draw();
  }
});

function finishPolygon() {
  if (!polygonMode || polygonPoints.length < 6) {
    polygonMode = false;
    document.getElementById('polyBtn').classList.remove('active');
    return;
  }

  if (tempLine) tempLine.destroy();
  tempCircles.forEach(c => c.destroy());
  tempCircles = [];

  const polygon = new Konva.Line({
    points: polygonPoints,
    fill: 'rgba(255,0,0,0.12)',
    stroke: 'red',
    strokeWidth: 3,
    dash: [10, 6],
    closed: true,
    draggable: true,
    name: 'polygon'
  });

  polygon.on('click tap', () => {
    selectedNode = polygon;
    transformer.nodes([]);
    showVertexHandles(polygon);
    layer.draw();
  });

  polygon.on('dragmove', () => {
    showVertexHandles(polygon);
  });

  layer.add(polygon);

  polygonMode = false;
  polygonPoints = [];
  document.getElementById('polyBtn').classList.remove('active');

  selectedNode = polygon;
  showVertexHandles(polygon);
  layer.draw();
}

function showVertexHandles(polygon) {
  hideVertexHandles();

  const points = polygon.points();
  const offsetX = polygon.x();
  const offsetY = polygon.y();

  for (let i = 0; i < points.length; i += 2) {
    const handle = new Konva.Circle({
      x: points[i] + offsetX,
      y: points[i + 1] + offsetY,
      radius: 7,
      fill: 'red',
      stroke: 'white',
      strokeWidth: 2,
      draggable: true
    });

    handle.on('dragmove', () => {
      const newPoints = polygon.points().slice();
      newPoints[i] = handle.x() - polygon.x();
      newPoints[i + 1] = handle.y() - polygon.y();
      polygon.points(newPoints);
      layer.draw();
    });

    vertexHandles.push(handle);
    layer.add(handle);
  }

  layer.draw();
}

function hideVertexHandles() {
  vertexHandles.forEach(h => h.destroy());
  vertexHandles = [];
}

function addArrow() {
  const arrow = new Konva.Arrow({
    x: width / 2 - 80,
    y: height / 2,
    points: [0, 0, 160, 0],
    pointerLength: 20,
    pointerWidth: 20,
    fill: 'green',
    stroke: 'green',
    strokeWidth: 8,
    draggable: true
  });

  arrow.on('click tap', () => selectNode(arrow));
  layer.add(arrow);
  selectNode(arrow);
}

function addTextBox() {
  const value = document.getElementById('customText').value || 'Testo';
  const group = new Konva.Group({
    x: width / 2 - 80,
    y: height / 2 - 30,
    draggable: true
  });

  const rect = new Konva.Rect({
    width: 180,
    height: 60,
    fill: 'white',
    stroke: 'black',
    strokeWidth: 2,
    cornerRadius: 4
  });

  const text = new Konva.Text({
    text: value,
    fontSize: 15,
    fill: 'black',
    width: 170,
    padding: 8
  });

  group.add(rect, text);
  group.on('click tap', () => selectNode(group));

  layer.add(group);
  selectNode(group);
}

function deleteSelected() {
  if (selectedNode) {
    selectedNode.destroy();
    transformer.nodes([]);
    selectedNode = null;
    hideVertexHandles();
    layer.draw();
  }
}

function clearObjects() {
  layer.children.forEach(child => {
    if (child !== backgroundImage && child !== transformer) {
      child.destroy();
    }
  });
  transformer.nodes([]);
  selectedNode = null;
  vertexHandles = [];
  layer.draw();
}

function exportPNG() {
  transformer.nodes([]);
  hideVertexHandles();
  layer.draw();

  const dataURL = stage.toDataURL({ pixelRatio: 2 });
  const link = document.createElement('a');
  link.download = 'planimetria_evento.png';
  link.href = dataURL;
  link.click();
}

loadBase('LUO-001_PIAZZA_GRAN_SASSO_BASE.png');
</script>

</body>
</html>
